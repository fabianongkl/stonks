# Publish the committed dashboard/ to GitHub Pages on every push.
# The daily-scan workflow also deploys after each scan; this one just makes
# dashboard changes (new pages, redesigns) live immediately without waiting
# for the nightly run. Deploy-only: ~30 seconds, no scanning.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
