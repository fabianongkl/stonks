# Daily screener run: scan the market, track the portfolio, commit the
# permanent record back to the repo, and publish the dashboard to Pages.
#
# One-time repo setup (see README):
#   * Settings -> Pages -> Source: "GitHub Actions"
#   * Settings -> Secrets and variables -> Actions -> New secret:
#       SEC_CONTACT = your@email (SEC fair-use identification)
name: daily-scan

on:
  schedule:
    # 03:00 UTC Tue-Sat = 11pm New York, the night of each Mon-Fri session.
    # Moved from 21:30 UTC on 2026-11-05: GitHub fires scheduled jobs hours
    # late, so the old slot landed in ~00:00-01:40 UTC, when Yahoo serves
    # the PREVIOUS day's bars for most stocks (measured on 41 scans).  Runs
    # after ~01:50 UTC were all correct.  run_scan.py labels and cuts the
    # panel by price date as a second line of defence.
    - cron: "0 3 * * 2-6"
  workflow_dispatch: {}        # manual "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scan
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python run_scan.py

      - name: Track portfolio
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python track_portfolio.py

      - name: S&P 500 lens
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python run_sp500.py

      - name: Commit the permanent record
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/screener.db journal dashboard \
                  data/cache/sic_map.parquet
          git add -f data/cache/companyfacts_fill.parquet || true
          git commit -m "scan: $(date -u +%F)" || echo "nothing new to commit"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
